name: backfill
on:
  workflow_dispatch:
    inputs:
      model: { description: "model_id", required: true }
      start: { description: "YYYY-MM-DD", required: true }
      end:   { description: "YYYY-MM-DD", required: true }
      workers: { description: "concurrent runs", required: false, default: "2" }
concurrency: { group: data-writes, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 1 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true, cache-dependency-glob: "pyproject.toml" }
      - run: uv sync --frozen
      - run: .venv/bin/castcheck backfill "$MODEL" "$START" "$END" --workers "$WORKERS"
        env:
          MODEL: ${{ inputs.model }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          WORKERS: ${{ inputs.workers }}
      - name: commit data
        run: scripts/commit_data.sh "[data] backfill $MODEL $START..$END"

  report-failure:
    needs: [backfill]
    if: failure()
    # The caller's workflow-level `contents: write` would otherwise cap the reusable
    # workflow at that one scope, and a reusable workflow may never ask for more than its caller.
    permissions: { contents: read, issues: write }
    uses: ./.github/workflows/_failure-issue.yml
    with:
      workflow: backfill
      note: >-
        Manually dispatched, so someone is probably already watching — the issue exists so a
        multi-hour backfill that dies at hour five is not discovered a week later. Backfill is
        idempotent: re-dispatch the same range.
