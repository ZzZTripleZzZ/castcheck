name: truth-daily
on:
  schedule:
    - cron: "30 10 * * *"   # first-final CLI for yesterday (all CONUS final by ~09:10Z)
    - cron: "0 16 * * *"    # corrections pass
  workflow_dispatch:
concurrency: { group: data-writes, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e .
      - run: .venv/bin/castcheck truth
      - run: .venv/bin/castcheck truth --date $(date -u -d '2 days ago' +%F)   # late/corrected reports
      - name: commit data
        run: |
          git config user.name "castcheck-bot" && git config user.email "bot@castcheck.zifanzhang.com"
          git add data && (git diff --cached --quiet || git commit -m "[data] truth $(date -u +%Y-%m-%d)") && git pull --rebase && git push
