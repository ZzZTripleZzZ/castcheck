name: truth-daily
on:
  schedule:
    - cron: "30 10 * * *"   # first-final CLI for yesterday (all CONUS final by ~09:10Z)
    - cron: "0 16 * * *"    # corrections pass
  workflow_dispatch:
concurrency: { group: data-writes, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 1 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true, cache-dependency-glob: "pyproject.toml" }
      - run: uv sync --frozen
      - run: .venv/bin/castcheck truth
      - run: .venv/bin/castcheck truth --date "$(date -u -d '2 days ago' +%F)"   # late/corrected reports
      - run: .venv/bin/castcheck truth-instant                                    # observed T at 00/06/12/18Z, UTC yesterday (NWS API)
      - run: .venv/bin/castcheck truth-instant --date $(date -u +%F)               # intraday top-up: today's instants that already exist
      - run: .venv/bin/castcheck truth-instant-backfill "$(date -u -d '10 days ago' +%F)" "$(date -u -d '2 days ago' +%F)"   # IEM archive overrides provisional NWS values
      - run: .venv/bin/castcheck truth-qc --start "$(date -u -d '15 days ago' +%F)"   # CLI extremes vs the day's own observations (METHODOLOGY §3.3)
      - name: commit data
        run: scripts/commit_data.sh "[data] truth $(date -u +%Y-%m-%d)"

  report-failure:
    needs: [truth]
    if: failure()
    # The caller's workflow-level `contents: write` would otherwise cap the reusable
    # workflow at that one scope, and a reusable workflow may never ask for more than its caller.
    permissions: { contents: read, issues: write }
    uses: ./.github/workflows/_failure-issue.yml
    with:
      workflow: truth-daily
      note: >-
        Truth is the one input CastCheck cannot re-derive later from its own archive if the upstream
        window closes. Check the NWS CLI product and the IEM AFOS archive before assuming a code
        problem; `truth --date` and `truth-instant-backfill` can be re-run by hand for any date.
