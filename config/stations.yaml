# CastCheck station list (MVP). Chosen to overlap Kalshi daily high/low temperature markets.
# `cli_pil` is the NWS AFOS product id (CLIxxx) whose YESTERDAY block is the daily climate truth.
# lat/lon/elev_m are filled by `scripts/build_stations.py` from api.weather.gov/stations/{icao}
# and then frozen here (do not hand-edit coordinates after freezing).
# `market_city` is the city label of the daily temperature market the station settles; it records the
# selection rule (METHODOLOGY §1) and is informational only — no market data is ever fetched or stored.
# `iem_id` is the station's id in the IEM ASOS archive; `grid_elev_m` the mean ETOPO 2022 60" surface
# elevation of the 0.25 deg model cell containing it, both written by scripts/build_stations.py.
stations:
